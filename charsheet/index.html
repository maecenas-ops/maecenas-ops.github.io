<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LITM Character Sheets</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#0d0d1a; --ink-mid:#1a1a2e; --ink-raised:#242438;
  --parch:#e8dfc8; --parch-dim:#b5a98a; --parch-faint:#7a6f58;
  --gold:#c9a84c; --gold-dim:#a07828; --gold-bright:#e2c06a;
  --teal:#4aafa0; --teal-dim:#2d7a70;
  --red:#c45050; --red-dim:#8b2e2e;
  --border:rgba(201,168,76,0.25); --border-hi:rgba(201,168,76,0.5);
  --line:rgba(201,168,76,0.1);
  --shadow:rgba(0,0,0,0.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);font-family:'Crimson Pro',Georgia,serif;color:var(--parch);font-size:15px}
#app{display:flex;flex-direction:column;height:100%;overflow:hidden}

.topbar{background:var(--ink-mid);border-bottom:1px solid var(--border-hi);padding:7px 10px;flex-shrink:0;display:flex;align-items:center;gap:7px}
.topbar-title{font-family:'Cinzel',serif;font-size:.62rem;color:var(--gold);letter-spacing:.18em;flex:1;text-transform:uppercase}
.char-select{background:rgba(0,0,0,.4);border:1px solid var(--border);color:var(--parch);font-family:'Crimson Pro',serif;font-size:.9rem;padding:3px 6px;border-radius:2px;cursor:pointer;max-width:140px}
.char-select option{background:var(--ink-mid)}
.icon-btn{background:rgba(201,168,76,.07);border:1px solid var(--border);color:var(--parch-dim);width:26px;height:26px;border-radius:2px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.icon-btn:hover{background:rgba(201,168,76,.15);border-color:var(--border-hi);color:var(--gold)}
.icon-btn.danger:hover{background:rgba(196,80,80,.2);border-color:var(--red);color:var(--red)}

.tabbar{background:var(--ink);border-bottom:1px solid var(--border);display:flex;flex-shrink:0;overflow-x:auto}
.tabbar::-webkit-scrollbar{display:none}
.tab{font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.1em;color:var(--parch-faint);padding:8px 10px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;text-transform:uppercase}
.tab:hover{color:var(--parch-dim)}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(201,168,76,.04)}

.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--ink);padding:10px}
.scroll-area::-webkit-scrollbar{width:5px}
.scroll-area::-webkit-scrollbar-track{background:var(--ink)}
.scroll-area::-webkit-scrollbar-thumb{background:rgba(201,168,76,.2);border-radius:3px}

.card{background:var(--ink-mid);border:1px solid var(--border);border-radius:3px;box-shadow:0 3px 16px var(--shadow);margin-bottom:10px;overflow:hidden}
.card-hdr{background:rgba(201,168,76,.07);padding:6px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.card-hdr-title{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.card-hdr-right{color:var(--parch-faint);font-size:.7rem}
.card-body{padding:10px}
.card-footer{background:rgba(201,168,76,.04);padding:3px 10px;border-top:1px solid var(--border);text-align:center;font-family:'Cinzel',serif;font-size:.45rem;letter-spacing:.22em;color:var(--parch-faint);text-transform:uppercase}

.f-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);font-family:'Crimson Pro',serif;font-size:.95rem;color:var(--parch);padding:1px 0 2px;outline:none;transition:border-color .2s}
.f-input:focus{border-bottom-color:var(--gold)}
.f-input::placeholder{color:var(--parch-faint);opacity:.6;font-style:italic}
.name-input{font-family:'Cinzel',serif;font-size:1.1rem;font-style:normal;letter-spacing:.06em;border-bottom-color:var(--border-hi);margin-bottom:6px;color:var(--gold-bright)}

.title-tag-wrap{display:flex;align-items:center;gap:6px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.title-tag-input{flex:1;background:transparent;border:none;font-family:'Crimson Pro',serif;font-size:1.1rem;font-style:italic;color:var(--parch);outline:none;padding:0}
.title-tag-input::placeholder{color:var(--parch-faint);opacity:.5}
.title-tag-input.scratched{text-decoration:line-through;opacity:.3;color:var(--red)}

.tag-list{list-style:none}
.tag-item{display:flex;align-items:center;gap:5px;padding:3px 0;border-bottom:1px solid var(--line)}
.tag-item:last-child{border-bottom:none}
.scratch-btn{width:15px;height:15px;flex-shrink:0;background:none;border:1px solid var(--border);border-radius:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.6rem;color:var(--parch-faint);transition:all .12s;line-height:1;padding:0}
.scratch-btn:hover{border-color:var(--border-hi);color:var(--parch-dim)}
.scratch-btn.on{background:rgba(196,80,80,.2);border-color:var(--red);color:var(--red)}
.tag-input{flex:1;background:transparent;border:none;font-family:'Crimson Pro',serif;font-size:.93rem;color:var(--parch);outline:none;padding:0}
.tag-input.scratched{text-decoration:line-through;opacity:.3;color:var(--red)}
.tag-input.weak{color:var(--red)}
.tag-input::placeholder{color:var(--parch-faint);opacity:.5;font-style:italic}

.s-label{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.14em;color:var(--gold);display:block;margin:8px 0 4px;text-transform:uppercase;opacity:.8}
.s-label:first-child{margin-top:0}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border-hi),transparent);margin:8px 0}

.circles-row{display:flex;align-items:center;gap:5px;margin:3px 0}
.c-label{font-family:'Cinzel',serif;font-size:.48rem;letter-spacing:.1em;color:var(--parch-dim);min-width:52px;text-transform:uppercase}
.circle{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--border-hi);background:transparent;cursor:pointer;transition:all .12s;flex-shrink:0}
.circle.filled.promise{background:var(--gold);border-color:var(--gold-bright)}
.circle.filled.abandon{background:var(--red);border-color:var(--red-dim)}
.circle.filled.improve{background:var(--teal);border-color:var(--teal-dim)}
.circle.filled.milestone{background:var(--gold);border-color:var(--gold-bright)}

.quest-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);font-family:'Crimson Pro',serif;font-size:.93rem;font-style:italic;color:var(--parch);outline:none;padding:1px 0}
.quest-input::placeholder{color:var(--parch-faint);opacity:.5}
.notes-area{width:100%;background:transparent;border:none;font-family:'Crimson Pro',serif;font-size:.93rem;color:var(--parch);outline:none;resize:none;line-height:1.7;padding:0;min-height:96px}
.notes-area::placeholder{color:var(--parch-faint);opacity:.5;font-style:italic}
.type-select{background:transparent;border:none;border-bottom:1px solid var(--border);font-family:'Crimson Pro',serif;font-size:.82rem;color:var(--parch-dim);outline:none;cursor:pointer;padding:1px 0;width:100%;margin-bottom:8px}
.type-select option{background:var(--ink-mid);color:var(--parch)}

.fellow-row{display:flex;gap:5px;border-bottom:1px solid var(--line);padding:3px 0}
.fellow-row:last-child{border-bottom:none}

.portrait-wrap{width:64px;height:64px;flex-shrink:0;border:1px solid var(--border-hi);border-radius:2px;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3)}
.portrait-wrap:hover{border-color:var(--gold)}
.portrait-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.portrait-ph{color:var(--parch-faint);font-family:'Cinzel',serif;font-size:.45rem;letter-spacing:.1em;text-align:center;line-height:1.8;text-transform:uppercase;pointer-events:none}

.toast{position:fixed;bottom:10px;right:10px;background:rgba(201,168,76,.15);border:1px solid var(--gold);color:var(--gold);font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.12em;padding:5px 14px;border-radius:2px;box-shadow:0 3px 10px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:999;text-transform:uppercase}
.toast.show{opacity:1}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--ink-mid);border:1px solid var(--border-hi);padding:22px 24px;border-radius:3px;width:280px;box-shadow:0 8px 32px rgba(0,0,0,.7);transform:translateY(6px);transition:transform .2s}
.overlay.open .modal{transform:translateY(0)}
.modal h2{font-family:'Cinzel',serif;color:var(--gold);font-size:.8rem;letter-spacing:.14em;margin-bottom:14px;text-transform:uppercase}
.modal input{width:100%;padding:4px 0;border:none;border-bottom:1px solid var(--border-hi);background:transparent;font-family:'Crimson Pro',serif;font-size:1.1rem;font-style:italic;color:var(--parch);outline:none;margin-bottom:16px}
.modal input:focus{border-bottom-color:var(--gold)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.btn{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.08em;padding:5px 14px;border-radius:2px;cursor:pointer;border:1px solid var(--border);transition:all .12s;text-transform:uppercase}
.btn-cancel{background:transparent;color:var(--parch-dim)}
.btn-cancel:hover{border-color:var(--border-hi);color:var(--parch)}
.btn-ok{background:rgba(201,168,76,.12);border-color:var(--gold);color:var(--gold)}
.btn-ok:hover{background:rgba(201,168,76,.22);color:var(--gold-bright)}

.empty{text-align:center;padding:40px 20px;color:var(--parch-faint);font-family:'Crimson Pro',serif;font-style:italic;font-size:1rem}
.loading{text-align:center;padding:40px 20px;color:var(--parch-faint);font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}

.status-row{display:flex;align-items:center;gap:5px;padding:4px 0;border-bottom:1px solid var(--line)}
.status-row:last-child{border-bottom:none}
.status-name{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);font-family:'Crimson Pro',serif;font-size:.93rem;color:var(--parch);outline:none;padding:0 0 1px}
.status-name::placeholder{color:var(--parch-faint);opacity:.5;font-style:italic}
.status-boxes{display:flex;gap:2px;flex-shrink:0}
.status-box{width:18px;height:18px;border-radius:2px;border:1px solid var(--border-hi);background:transparent;cursor:pointer;font-family:'Cinzel',serif;font-size:.5rem;color:var(--parch-faint);transition:all .12s;padding:0;flex-shrink:0}
.status-box:hover{border-color:var(--gold);color:var(--gold)}
.status-box.marked{background:var(--teal);border-color:var(--teal-dim);color:var(--ink-mid)}
.status-box.marked.warn{background:var(--gold);border-color:var(--gold-dim);color:var(--ink)}
.status-box.marked.danger{background:var(--red);border-color:var(--red-dim);color:var(--parch)}
.status-del{background:none;border:none;color:var(--parch-faint);cursor:pointer;font-size:.85rem;padding:0 2px;line-height:1;transition:color .12s;flex-shrink:0}
.status-del:hover{color:var(--red)}
.status-add{background:rgba(201,168,76,.07);border:1px dashed var(--border);color:var(--parch-faint);font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;padding:5px;width:100%;border-radius:2px;cursor:pointer;margin-top:6px;transition:all .15s}
.status-add:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.1)}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="topbar-title">LITM Sheets</span>
    <select class="char-select" id="charSelect" onchange="switchChar(this.value)"></select>
    <button class="icon-btn" onclick="openModal()" title="New character">&#xFF0B;</button>
    <button class="icon-btn" onclick="exportChar()" title="Export character to file" style="width:auto;padding:0 8px;font-size:.5rem;letter-spacing:.1em;font-family:'Cinzel',serif;">Export</button>
    <button class="icon-btn" onclick="document.getElementById('importInput').click()" title="Import character from file" style="width:auto;padding:0 8px;font-size:.5rem;letter-spacing:.1em;font-family:'Cinzel',serif;">Import</button>
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importChar(event)">
    <button class="icon-btn danger" onclick="deleteChar()" title="Delete character" style="width:auto;padding:0 8px;font-size:.5rem;letter-spacing:.1em;font-family:'Cinzel',serif;">Delete</button>
  </div>
  <div class="tabbar" id="tabbar"></div>
  <div class="scroll-area" id="scrollArea"><div class="loading">Initialising&#x2026;</div></div>
</div>

<div class="toast" id="toast">Saved</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>New Character</h2>
    <input type="text" id="newName" placeholder="Character name&#x2026;">
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-ok" onclick="createChar()">Create</button>
    </div>
  </div>
</div>

<script src="sdk/obr-sdk.iife.js"></script>
<script>
// ═══════════════════════════════════════════════
// BOOT — uses bundled OBR SDK (window.OBR)
// ═══════════════════════════════════════════════

// ═══════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════
const PLAYER_TABS = ['Hero','Theme 1','Theme 2','Theme 3','Theme 4','Backpack'];
const GM_TABS     = ['Hero','Theme 1','Theme 2','Theme 3','Theme 4','Backpack','\u2694 Party'];
let TABS = PLAYER_TABS;

const LS_KEY   = 'litm2';
const META_KEY = 'com.litm.sheets/chars';

// ═══════════════════════════════════════════════
// DATA HELPERS
// ═══════════════════════════════════════════════
function emptyTag()   { return {val:'',scratched:false}; }
function emptyTags(n) { return Array.from({length:n}, emptyTag); }

function newTheme() {
  return {type:'',titleTag:emptyTag(),powerTags:emptyTags(7),weakTags:emptyTags(2),quest:'',abandon:0,improve:0,milestone:0,specialTags:emptyTags(2)};
}
function newChar(name) {
  return {name,playerName:'',heroImage:'',bio:'',promise:0,quintessences:'',
    fellowRelations:[{companion:'',tag:''},{companion:'',tag:''},{companion:'',tag:''}],
    themes:[newTheme(),newTheme(),newTheme(),newTheme()],
    backpack:emptyTags(8),notes:'',statuses:[]};
}

function fixTag(tg) {
  if (!tg) return emptyTag();
  if (typeof tg === 'string') return {val:tg,scratched:false};
  return tg;
}
function migrateChar(c) {
  if (!c) return newChar('');
  if (!c.themes || !c.themes.length) c.themes = [newTheme(),newTheme(),newTheme(),newTheme()];
  c.themes = c.themes.map(t => {
    if (!t) return newTheme();
    t.titleTag  = fixTag(t.titleTag);
    if (!t.powerTags || !t.powerTags.length) t.powerTags = emptyTags(7);
    if (!t.weakTags  || !t.weakTags.length)  t.weakTags  = emptyTags(2);
    t.powerTags = t.powerTags.map(fixTag);
    t.weakTags  = t.weakTags.map(fixTag);
    if (!t.specialTags || !t.specialTags.length) t.specialTags = emptyTags(2);
    t.specialTags = t.specialTags.map(fixTag);
    return t;
  });
  if (!c.backpack || !c.backpack.length) c.backpack = emptyTags(8);
  c.backpack = c.backpack.map(fixTag);
  if (!c.fellowRelations) c.fellowRelations = [{companion:'',tag:''},{companion:'',tag:''},{companion:'',tag:''}];
  if (!c.heroImage) c.heroImage = '';
  if (!c.bio) c.bio = '';
  if (!c.statuses) c.statuses = [];
  return c;
}

// ═══════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════
let _chars     = {};
let isOBR      = false;
let isGM       = false;
let partyData  = {};
let unsubParty = null;

function load() { return _chars; }

function saveChars(chars) {
  _chars = chars;
  if (isOBR) {
    window.OBR.player.setMetadata({[META_KEY]: chars}).then(showToast).catch(function(){showToast();});
  } else {
    try { localStorage.setItem(LS_KEY, JSON.stringify(chars)); } catch(e) {}
    showToast();
  }
}

let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!curChar) return;
    const data = load();
    data[curChar] = readState();
    saveChars(data);
  }, 500);
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1400);
}

function subscribeParty() {
  if (!isOBR || !isGM || !window.OBR) return;
  if (unsubParty) unsubParty();
  unsubParty = window.OBR.party.onChange(players => {
    partyData = {};
    for (const p of players) {
      const meta = p.metadata || {};
      partyData[p.id] = {playerName:p.name, chars:meta[META_KEY]||{}};
    }
    if (curTab === TABS.length - 1) renderTabContent();
  });
}

// ═══════════════════════════════════════════════
// UI STATE
// ═══════════════════════════════════════════════
let curChar = null;
let curTab  = 0;

function charList() { return Object.keys(_chars); }

function switchChar(name) {
  if (curChar && curTab !== TABS.length - 1) {
    const data = load();
    data[curChar] = readState();
    saveChars(data);
  }
  curChar = name;
  curTab  = 0;
  renderAll();
}
window.switchChar = switchChar;

function switchTab(idx) {
  if (curChar && curTab !== TABS.length - 1) {
    const data = load();
    data[curChar] = readState();
    saveChars(data);
  }
  curTab = idx;
  renderTabContent();
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===idx));
}
window.switchTab = switchTab;

// ═══════════════════════════════════════════════
// READ DOM
// ═══════════════════════════════════════════════
function readTag(id) {
  const el = document.getElementById(id);
  if (!el) return emptyTag();
  return {val:el.value, scratched:el.dataset.scratched==='1'};
}
function readTags(pfx, n) { return Array.from({length:n},(_,i)=>readTag(pfx+'_'+i)); }
function readCircle(id) { const el=document.getElementById(id); return el?parseInt(el.dataset.count||'0'):0; }
function readVal(id) { const el=document.getElementById(id); return el?el.value:''; }

function readState() {
  if (!curChar) return null;
  const data = load();
  const c = data[curChar] || newChar(curChar);
  if (curTab===0) {
    c.name=readVal('heroName'); c.playerName=readVal('playerName');
    c.bio=readVal('heroBio');
    c.promise=readCircle('promiseTrack'); c.quintessences=readVal('quintessences');
    c.fellowRelations=[0,1,2].map(i=>({companion:readVal('fr_c_'+i),tag:readVal('fr_t_'+i)}));
    // statuses are written directly on interaction, not via DOM read
  } else if (curTab>=1 && curTab<=4) {
    const t=c.themes[curTab-1];
    t.type=readVal('th_type'); t.quest=readVal('th_quest');
    t.abandon=readCircle('th_abandon'); t.improve=readCircle('th_improve'); t.milestone=readCircle('th_milestone');
    t.titleTag=readTag('th_title'); t.powerTags=readTags('th_p',7); t.weakTags=readTags('th_w',2); t.specialTags=readTags('th_s',2);
  } else if (curTab===5) {
    c.backpack=readTags('bp',8); c.notes=readVal('heroNotes');
  }
  return c;
}

// ═══════════════════════════════════════════════
// HTML HELPERS
// ═══════════════════════════════════════════════
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function tagRow(id, ph, tag, weak) {
  const sc = !!(tag&&tag.scratched);
  return '<li class="tag-item">'
    +'<button class="scratch-btn'+(sc?' on':'')+'" onclick="toggleScratch(\''+id+'\')">'+(sc?'&#x2715;':'/')+'</button>'
    +'<input class="tag-input'+(weak?' weak':'')+(sc?' scratched':'')+'" id="'+id+'" type="text"'
    +' placeholder="'+ph+'" value="'+esc(tag&&tag.val||'')+'"'
    +' data-scratched="'+(sc?1:0)+'" oninput="scheduleSave()">'
    +'</li>';
}

function circleRow(id, label, count, max, cls) {
  let h='<div class="circles-row" id="'+id+'" data-count="'+count+'"><span class="c-label">'+label+'</span>';
  for (let i=0;i<max;i++) h+='<button class="circle '+cls+(i<count?' filled':'')+'" data-idx="'+i+'" onclick="toggleCircle(\''+id+'\','+i+','+max+',\''+cls+'\')" title="'+label+' '+(i+1)+'"></button>';
  return h+'</div>';
}

function card(titleHtml, right, body, footer) {
  return '<div class="card">'
    +'<div class="card-hdr"><span class="card-hdr-title">'+titleHtml+'</span>'+(right?'<span class="card-hdr-right">'+right+'</span>':'')+'</div>'
    +'<div class="card-body">'+body+'</div>'
    +'<div class="card-footer">'+(footer||'Legend in the Mist')+'</div>'
    +'</div>';
}

// ═══════════════════════════════════════════════
// TAB RENDERERS
// ═══════════════════════════════════════════════
function heroHtml(c) {
  const imgInner = c.heroImage
    ? '<img src="'+esc(c.heroImage)+'" alt="portrait">'
    : '<span class="portrait-ph">ADD<br>IMAGE</span>';
  let b = '<input type="file" id="heroImgInput" accept="image/*" style="display:none" onchange="handleHeroImage(event)">'
    +'<div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:8px">'
    +'<div class="portrait-wrap" onclick="document.getElementById(\'heroImgInput\').click()" title="Upload portrait">'+imgInner+'</div>'
    +'<div style="flex:1;min-width:0">'
    +'<input class="f-input name-input" id="heroName" type="text" placeholder="Character Name" value="'+esc(c.name)+'" oninput="scheduleSave()">'
    +'<input class="f-input" id="playerName" type="text" placeholder="Player Name" value="'+esc(c.playerName||'')+'" oninput="scheduleSave()">'
    +'</div>'
    +'</div>'
    +'<div class="divider"></div>'
    +'<span class="s-label">Bio &amp; Background</span>'
    +'<textarea class="notes-area" id="heroBio" placeholder="Who are you, and how did you come to this&#x2026;" oninput="scheduleSave()" style="min-height:72px">'+esc(c.bio||'')+'</textarea>'
    +'<div class="divider"></div><span class="s-label">Fellowship Relationships</span>';
  for (let i=0;i<3;i++) {
    const fr=(c.fellowRelations&&c.fellowRelations[i])||{companion:'',tag:''};
    b+='<div class="fellow-row">'
      +'<input class="f-input" style="flex:1" id="fr_c_'+i+'" type="text" placeholder="Companion" value="'+esc(fr.companion||'')+'" oninput="scheduleSave()">'
      +'<input class="f-input" style="flex:1.4" id="fr_t_'+i+'" type="text" placeholder="Relationship tag" value="'+esc(fr.tag||'')+'" oninput="scheduleSave()">'
      +'</div>';
  }
  b+='<div class="divider"></div>'+circleRow('promiseTrack','Promise',c.promise||0,5,'promise')
    +'<div class="divider"></div><span class="s-label">Quintessences</span>'
    +'<input class="f-input" id="quintessences" type="text" placeholder="&#x2026;" value="'+esc(c.quintessences||'')+'" oninput="scheduleSave()">';

  // Statuses
  b += '<div class="divider"></div><span class="s-label">Statuses</span>';
  const statuses = c.statuses || [];
  if (statuses.length) {
    b += '<div id="status-list">';
    statuses.forEach((st, si) => {
      b += statusRowHtml(st, si);
    });
    b += '</div>';
  } else {
    b += '<div id="status-list"></div>';
  }
  b += '<button class="status-add" onclick="addStatus()">+ Add Status</button>';

  return card('Hero Card','&#x2694;',b);
}

function themeHtml(c, ti) {
  const t = c.themes[ti]||newTheme();
  const ttSc=!!(t.titleTag&&t.titleTag.scratched);
  const ORIGIN_TYPES = ['Circumstance','Devotion','Past','People','Personality','Skill or Trade','Trait'];
  const ADVENTURE_TYPES = ['Duty','Influence','Knowledge','Prodigious Ability','Relic','Uncanny Being'];
  const GREATNESS_TYPES = ['Destiny','Dominion','Mastery','Monstrosity'];
  let opts='<option value="">\u2014 type \u2014</option>'
    +'<optgroup label="Origin">'+ORIGIN_TYPES.map(o=>'<option value="'+esc(o)+'"'+(t.type===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</optgroup>'
    +'<optgroup label="Adventure">'+ADVENTURE_TYPES.map(o=>'<option value="'+esc(o)+'"'+(t.type===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</optgroup>'
    +'<optgroup label="Greatness">'+GREATNESS_TYPES.map(o=>'<option value="'+esc(o)+'"'+(t.type===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</optgroup>';
  let b='<select class="type-select" id="th_type" onchange="scheduleSave()">'+opts+'</select>'
    +'<span class="s-label">Title Tag</span>'
    +'<div class="title-tag-wrap">'
    +'<button class="scratch-btn'+(ttSc?' on':'')+'" onclick="toggleScratch(\'th_title\')">'+(ttSc?'&#x2715;':'/')+'</button>'
    +'<input class="title-tag-input'+(ttSc?' scratched':'')+'" id="th_title" type="text"'
    +' placeholder="theme title&#x2026;" value="'+esc(t.titleTag&&t.titleTag.val||'')+'"'
    +' data-scratched="'+(ttSc?1:0)+'" oninput="scheduleSave()">'
    +'</div>'
    +'<span class="s-label">Power Tags</span><ul class="tag-list">';
  t.powerTags.forEach((tg,i)=>{ b+=tagRow('th_p_'+i,'power tag&#x2026;',tg,false); });
  b+='</ul><div class="divider"></div><span class="s-label">Weakness</span><ul class="tag-list">';
  t.weakTags.forEach((tg,i)=>{ b+=tagRow('th_w_'+i,'weakness tag&#x2026;',tg,true); });
  b+='</ul><div class="divider"></div>'
    +'<span class="s-label">Quest</span>'
    +'<input class="quest-input" id="th_quest" type="text" placeholder="What drives this theme&#x2026;" value="'+esc(t.quest||'')+'" oninput="scheduleSave()">'
    +'<div style="margin-top:8px">'
    +circleRow('th_abandon','Abandon',t.abandon||0,3,'abandon')
    +circleRow('th_improve','Improve',t.improve||0,3,'improve')
    +circleRow('th_milestone','Milestone',t.milestone||0,3,'milestone')
    +'</div>'
    +'<div class="divider"></div>'
    +'<span class="s-label">Special Improvements</span><ul class="tag-list">';
  t.specialTags.forEach((tg,i)=>{ b+=tagRow('th_s_'+i,'special improvement&#x2026;',tg,false); });
  b+='</ul>';
  return card('Theme Card '+(ti+1),'&#x1F343; &#x2694; &#x1F451;',b);
}

function backpackHtml(c) {
  let b='<span class="s-label">Story Tags</span><ul class="tag-list">';
  c.backpack.forEach((tg,i)=>{ b+=tagRow('bp_'+i,'story tag&#x2026;',tg,false); });
  b+='</ul><div class="divider"></div><span class="s-label">Notes</span>'
    +'<textarea class="notes-area" id="heroNotes" placeholder="Notes, reminders, loose threads&#x2026;" oninput="scheduleSave()">'+esc(c.notes||'')+'</textarea>';
  return card('Backpack','&#x1F392;',b,'Son of Oak');
}

function partyHtml() {
  const entries = Object.values(partyData);
  if (!entries.length) return '<div class="empty">No players connected yet.<br>They will appear here once they join the room and open their sheet.</div>';
  let html='';
  for (const {playerName,chars} of entries) {
    const names=Object.keys(chars||{});
    if (!names.length) { html+=card(esc(playerName||'Unknown'),'','<div style="color:var(--parch-faint);font-style:italic;font-size:.9rem">No character saved yet.</div>'); continue; }
    for (const cname of names) {
      const c=migrateChar(chars[cname]);
      let b='<div style="margin-bottom:6px"><span class="s-label">Promise</span><div class="circles-row">';
      for (let i=0;i<5;i++) b+='<span class="circle promise'+(i<(c.promise||0)?' filled':'')+'" style="cursor:default"></span>';
      b+='</div></div><div class="divider"></div><span class="s-label">Themes</span>';
      c.themes.forEach(t=>{
        const title=(t.titleTag&&t.titleTag.val)||'&#x2014;';
        const type=(t.type&&t.type!=='\u2014 type \u2014')?' ('+esc(t.type)+')':'';
        b+='<div style="font-size:.85rem;border-bottom:1px solid var(--line);padding:3px 0">'
          +'<span style="font-family:\'Crimson Pro\',serif;font-style:italic">'+esc(title)+'</span>'
          +'<span style="color:var(--parch-faint);font-size:.8rem">'+type+'</span>'
          +(t.quest?'<div style="font-style:italic;color:var(--parch-dim);font-size:.78rem">'+esc(t.quest)+'</div>':'')
          +'</div>';
      });
      const bpTags=c.backpack.filter(t=>t&&t.val);
      if (bpTags.length) {
        b+='<div class="divider"></div><span class="s-label">Backpack</span><div style="font-size:.8rem;line-height:1.8">';
        bpTags.forEach(t=>{ b+='<span style="'+(t.scratched?'text-decoration:line-through;opacity:.4':'')+'">'+(esc(t.val)||'')+'</span> &middot; '; });
        b+='</div>';
      }
      if (c.notes) b+='<div class="divider"></div><span class="s-label">Notes</span><div style="font-style:italic;font-size:.85rem;color:var(--parch-dim)">'+esc(c.notes)+'</div>';
      const hdr='<span style="font-family:\'Crimson Pro\',serif;font-style:italic">'+esc(cname)+'</span>'
        +' <span style="font-family:\'Cinzel\',serif;font-size:.55rem;letter-spacing:.08em;color:var(--parch-faint)">'+esc(playerName||'')+'</span>';
      html+=card(hdr,'',b);
    }
  }
  return html;
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function renderSelect() {
  const sel=document.getElementById('charSelect');
  const chars=charList();
  sel.innerHTML=chars.length
    ?chars.map(n=>'<option value="'+esc(n)+'"'+(n===curChar?' selected':'')+'>'+esc(n)+'</option>').join('')
    :'<option value="">&#x2014; none &#x2014;</option>';
}

function renderTabs() {
  document.getElementById('tabbar').innerHTML=
    TABS.map((name,i)=>'<button class="tab'+(i===curTab?' active':'')+'" onclick="switchTab('+i+')">'+esc(name)+'</button>').join('');
}

function renderTabContent() {
  const area=document.getElementById('scrollArea');
  const partyIdx=isGM?TABS.length-1:-1;
  if (curTab!==partyIdx&&!curChar) {
    area.innerHTML='<div class="empty">No characters yet.<br>Click &#xFF0B; to create one.</div>';
    return;
  }
  const c=curChar?migrateChar(load()[curChar]||newChar(curChar)):null;
  let html='';
  if      (curTab===partyIdx)        html=partyHtml();
  else if (curTab===0)               html=heroHtml(c);
  else if (curTab>=1&&curTab<=4)     html=themeHtml(c,curTab-1);
  else if (curTab===5)               html=backpackHtml(c);
  area.innerHTML=html;
  area.scrollTop=0;
}

function renderAll() { renderSelect(); renderTabs(); renderTabContent(); }

// ═══════════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════════
function toggleScratch(id) {
  const el=document.getElementById(id);
  if (!el) return;
  const now=el.dataset.scratched==='1';
  el.dataset.scratched=now?'0':'1';
  el.classList.toggle('scratched',!now);
  const btn=el.previousElementSibling;
  if (btn&&btn.classList.contains('scratch-btn')) {
    btn.classList.toggle('on',!now);
    btn.innerHTML=now?'/':'&#x2715;';
  }
  scheduleSave();
}
window.toggleScratch=toggleScratch;

function toggleCircle(trackId,idx,max,cls) {
  const wrap=document.getElementById(trackId);
  if (!wrap) return;
  const cur=parseInt(wrap.dataset.count||'0');
  const next=idx<cur?idx:idx+1;
  wrap.dataset.count=next;
  const label=wrap.querySelector('.c-label')?wrap.querySelector('.c-label').textContent:'';
  let h='<span class="c-label">'+label+'</span>';
  for (let i=0;i<max;i++) h+='<button class="circle '+cls+(i<next?' filled':'')+'" data-idx="'+i+'" onclick="toggleCircle(\''+trackId+'\','+i+','+max+',\''+cls+'\')" title="'+label+' '+(i+1)+'"></button>';
  wrap.innerHTML=h;
  scheduleSave();
}
window.toggleCircle=toggleCircle;

function openModal() {
  document.getElementById('newName').value='';
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('newName').focus(),60);
}
window.openModal=openModal;

function closeModal() { document.getElementById('overlay').classList.remove('open'); }
window.closeModal=closeModal;

function createChar() {
  const name=document.getElementById('newName').value.trim();
  if (!name) return;
  const data=load();
  if (!data[name]) data[name]=newChar(name);
  saveChars(data);
  closeModal();
  curChar=name; curTab=0;
  renderAll();
}
window.createChar=createChar;

function handleHeroImage(event) {
  const file = event.target.files[0];
  if (!file || !curChar) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const data = load();
    const c = data[curChar] || newChar(curChar);
    c.heroImage = e.target.result;
    data[curChar] = c;
    saveChars(data);
    const wrap = document.querySelector('.portrait-wrap');
    if (wrap) wrap.innerHTML = '<img src="'+e.target.result+'" alt="portrait">';
  };
  reader.readAsDataURL(file);
}
window.handleHeroImage = handleHeroImage;

function statusRowHtml(st, si) {
  let boxes = '';
  for (let t = 1; t <= 6; t++) {
    const marked = !!(st.boxes && st.boxes[t]);
    const cls = marked ? (t === 6 ? ' danger' : t === 5 ? ' warn' : '') : '';
    boxes += '<button class="status-box'+(marked?' marked'+cls:'')+'" onclick="toggleStatusBox('+si+','+t+')" title="Tier '+t+'">'+t+'</button>';
  }
  return '<div class="status-row" id="status-row-'+si+'">'
    +'<input class="status-name" type="text" placeholder="status name…" value="'+esc(st.name||'')+'" oninput="updateStatusName('+si+', this.value)">'
    +boxes
    +'<button class="status-del" onclick="removeStatus('+si+')" title="Remove">&#x2715;</button>'
    +'</div>';
}

window.addStatus = function() {
  const data = load();
  const c = data[curChar] || newChar(curChar);
  c.statuses = c.statuses || [];
  c.statuses.push({name:'', boxes:{}});
  data[curChar] = c;
  saveChars(data);
  // append row without full re-render
  const list = document.getElementById('status-list');
  if (list) {
    list.insertAdjacentHTML('beforeend', statusRowHtml({name:'',boxes:{}}, c.statuses.length-1));
  }
};

window.updateStatusName = function(si, val) {
  const data = load();
  const c = data[curChar];
  if (!c || !c.statuses || !c.statuses[si]) return;
  c.statuses[si].name = val;
  data[curChar] = c;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveChars(data), 500);
};

window.toggleStatusBox = function(si, tier) {
  const data = load();
  const c = data[curChar];
  if (!c || !c.statuses || !c.statuses[si]) return;
  const st = c.statuses[si];
  st.boxes = st.boxes || {};
  st.boxes[tier] = !st.boxes[tier];
  data[curChar] = c;
  saveChars(data);
  // update just this row
  const row = document.getElementById('status-row-'+si);
  if (row) row.outerHTML = statusRowHtml(st, si);
};

window.removeStatus = function(si) {
  const data = load();
  const c = data[curChar];
  if (!c || !c.statuses) return;
  c.statuses.splice(si, 1);
  data[curChar] = c;
  saveChars(data);
  // re-render the whole status list to fix indices
  const list = document.getElementById('status-list');
  if (list) {
    list.innerHTML = c.statuses.map((st, i) => statusRowHtml(st, i)).join('');
  }
};
  if (!curChar) return;
  const data = load();
  const c = data[curChar] || newChar(curChar);
  const json = JSON.stringify(c, null, 2);
  const blob = new Blob([json], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (curChar || 'character').replace(/[^a-z0-9]/gi, '-') + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
window.exportChar = exportChar;

function importChar(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const c = migrateChar(JSON.parse(e.target.result));
      if (!c || !c.name) { alert('Invalid character file.'); return; }
      const data = load();
      // If name already exists, ask whether to overwrite
      if (data[c.name] && !confirm('"' + c.name + '" already exists. Overwrite?')) return;
      data[c.name] = c;
      saveChars(data);
      curChar = c.name;
      curTab = 0;
      renderAll();
    } catch(err) {
      alert('Could not read file — make sure it\'s a valid character export.');
    }
  };
  reader.readAsText(file);
  // Reset so the same file can be re-imported if needed
  event.target.value = '';
}
window.importChar = importChar;

function deleteChar() {
  if (!curChar) return;
  if (!confirm('Delete "'+curChar+'"?')) return;
  const data=load();
  delete data[curChar];
  saveChars(data);
  const chars=Object.keys(data);
  curChar=chars.length?chars[0]:null; curTab=0;
  renderAll();
}
window.deleteChar=deleteChar;

window.scheduleSave=scheduleSave;

document.getElementById('newName').addEventListener('keydown',e=>{
  if (e.key==='Enter') createChar();
  if (e.key==='Escape') closeModal();
});
document.getElementById('overlay').addEventListener('click',e=>{
  if (e.target===document.getElementById('overlay')) closeModal();
});

// ═══════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════
function init() {
  if (typeof window.OBR === 'undefined' || !window.OBR.isAvailable) {
    isOBR=false; isGM=false; TABS=PLAYER_TABS;
    try { _chars=JSON.parse(localStorage.getItem(LS_KEY)||'{}'); } catch(e) { _chars={}; }
    const chars=Object.keys(_chars);
    if (chars.length) curChar=chars[0];
    renderAll();
    return;
  }

  window.OBR.onReady(function() {
    isOBR=true;
    window.OBR.player.getRole().then(function(role) {
      isGM=(role==='GM');
      TABS=isGM?GM_TABS:PLAYER_TABS;
      return window.OBR.player.getMetadata();
    }).then(function(meta) {
      _chars=(meta&&meta[META_KEY])?meta[META_KEY]:{};
      if (isGM) {
        window.OBR.party.getPlayers().then(function(players) {
          partyData={};
          for (const p of players) {
            const meta=p.metadata||{};
            partyData[p.id]={playerName:p.name,chars:meta[META_KEY]||{}};
          }
          subscribeParty();
        }).catch(function(){});
      }
      const chars=Object.keys(_chars);
      if (chars.length) curChar=chars[0];
      renderAll();
    }).catch(function(e) {
      console.warn('LITM Sheets: init error', e);
      const chars=Object.keys(_chars);
      if (chars.length) curChar=chars[0];
      renderAll();
    });
  });
}

init();
</script>
</body>
</html>
